<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Payment Required | GRATZ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='img/icons/icon-192.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/icons/favicon.ico') }}">
  <meta name="theme-color" content="#16181a">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img class="logo-icon" src="{{ url_for('static', filename='img/logo-mark.png') }}" alt="">
      <h1>GRATZ</h1>
      <p>Logistics Company</p>
    </div>

    <div class="alert alert-warning" style="margin-bottom:14px;text-align:left;">
      <strong>Subscription Payment Required</strong>
      <p style="margin:8px 0 0;">{{ message }}</p>
    </div>

    {% if current_user.is_authenticated %}
    <a href="{{ url_for('logout') }}" class="btn btn-outline" style="width:100%;">Sign Out</a>
    {% else %}
    <a href="{{ url_for('login') }}" class="btn btn-outline" style="width:100%;">Back to Sign In</a>
    {% endif %}

    <div class="login-footer">
      <p>GRATZ Logistics Company &copy; 2026 &mdash; All rights reserved</p>
    </div>
  </div>
</div>
</body>
</html>
