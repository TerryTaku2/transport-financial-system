{% extends 'base.html' %}
{% block title %}{{ action }} Daily Log{% endblock %}
{% block page_title %}{{ action }} Daily Log{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>{{ action }} Daily Log</h1>
    <div class="subtitle">Shift revenue, trips, and crew assignment</div>
  </div>
  <a href="{{ url_for('daily_logs') }}" class="btn btn-outline"><i data-feather="arrow-left"></i> Back</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid mb-16">
        <div class="form-group">
          <label>Date<span class="req">*</span></label>
          <input type="date" name="log_date" required value="{{ log.log_date.strftime('%Y-%m-%d') if log else today }}">
        </div>
        <div class="form-group">
          <label>Vehicle<span class="req">*</span></label>
          <select name="vehicle_id" required>
            <option value="">Select vehicle</option>
            {% for v in vehicles %}
            <option value="{{ v.id }}" {% if log and log.vehicle_id==v.id %}selected{% endif %}>{{ v.registration }} — {{ v.make }} {{ v.model }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Route<span class="req">*</span></label>
          <select name="route_id" required>
            <option value="">Select route</option>
            {% for r in routes %}
            <option value="{{ r.id }}" {% if log and log.route_id==r.id %}selected{% endif %}>{{ r.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Driver<span class="req">*</span></label>
          <select name="driver_id" required>
            <option value="">Select driver</option>
            {% for d in drivers if d.role == 'driver' %}
            <option value="{{ d.id }}" {% if log and log.driver_id==d.id %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Conductor</label>
          <select name="conductor_id">
            <option value="">None</option>
            {% for d in drivers if d.role == 'conductor' %}
            <option value="{{ d.id }}" {% if log and log.conductor_id==d.id %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Trips Completed</label>
          <input type="number" name="trips_completed" min="0" value="{{ log.trips_completed if log else 0 }}">
        </div>
        <div class="form-group">
          <label>Gross Revenue (USD)<span class="req">*</span></label>
          <input type="number" name="gross_revenue" step="0.01" min="0" required
                 value="{{ log.gross_revenue if log else '' }}">
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea name="notes">{{ log.notes if log else '' }}</textarea>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Save Log</button>
        <a href="{{ url_for('daily_logs') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
