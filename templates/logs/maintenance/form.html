{% extends 'base.html' %}
{% block title %}Record Maintenance{% endblock %}
{% block page_title %}Record Maintenance{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Record Maintenance / Repair</h1>
    <div class="subtitle">Spare parts and mechanic labor cost</div>
  </div>
  <a href="{{ url_for('maintenance_logs') }}" class="btn btn-outline"><i data-feather="arrow-left"></i> Back</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST" data-offline-form>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid mb-16">
        <div class="form-group">
          <label>Date<span class="req">*</span></label>
          <input type="date" name="log_date" required value="{{ today }}">
        </div>
        <div class="form-group">
          <label>Vehicle<span class="req">*</span></label>
          <select name="vehicle_id" required>
            <option value="">Select vehicle</option>
            {% for v in vehicles %}
            <option value="{{ v.id }}">{{ v.registration }} — {{ v.make }} {{ v.model }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group full">
          <label>Description<span class="req">*</span></label>
          <input type="text" name="description" required placeholder="e.g. Brake pads replacement, clutch repair">
        </div>
        <div class="form-group">
          <label>Parts Cost (USD)</label>
          <input type="number" id="parts_cost" name="parts_cost" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
          <label>Labor Cost (USD)</label>
          <input type="number" id="labor_cost" name="labor_cost" step="0.01" min="0" value="0">
        </div>
        <div class="form-group">
          <label>Mechanic / Garage</label>
          <input type="text" name="mechanic">
        </div>
        <div class="form-group">
          <label>Total Cost (auto-calculated)</label>
          <div style="font-size:20px;font-weight:700;color:var(--danger);padding-top:6px;" id="maint_total_preview">$0.00</div>
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea name="notes"></textarea>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Save Maintenance Log</button>
        <a href="{{ url_for('maintenance_logs') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
