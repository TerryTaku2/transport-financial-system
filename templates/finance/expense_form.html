{% extends 'base.html' %}
{% block title %}Add Expense{% endblock %}
{% block page_title %}Add Expense{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Add Expense</h1>
    <div class="subtitle">Overhead not covered by fuel or maintenance logs</div>
  </div>
  <a href="{{ url_for('expenses_list') }}" class="btn btn-outline"><i data-feather="arrow-left"></i> Back to Expenses</a>
</div>

<!-- Owns the "Category not listed? Add it" fields below, which live
     physically inside the main form's markup (for layout) but must not be
     a literal nested <form> — nested forms are invalid HTML and browsers
     silently merge them into the outer one, breaking submission. The
     `form="expense-category-quick-add"` attribute on those fields is what
     actually binds them to this form instead. -->
<form id="expense-category-quick-add" method="POST" action="{{ url_for('expense_category_add') }}" style="display:none;"></form>

<div class="card">
  <div class="card-body">
    <form method="POST" data-offline-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid mb-16">
        <div class="form-group">
          <label>Category<span class="req">*</span></label>
          <select name="category_id" required>
            {% for h in headings %}
            {% if h.children %}
            <optgroup label="{{ h.name }}">
              <option value="{{ h.id }}" {% if selected_category_id|string == h.id|string %}selected{% endif %}>{{ h.name }} (general)</option>
              {% for c in h.children|sort(attribute='name') %}
              <option value="{{ c.id }}" {% if selected_category_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
              {% endfor %}
            </optgroup>
            {% else %}
            <option value="{{ h.id }}" {% if selected_category_id|string == h.id|string %}selected{% endif %}>{{ h.name }}</option>
            {% endif %}
            {% endfor %}
          </select>
          <details style="margin-top:6px;">
            <summary class="form-hint" style="cursor:pointer;">Category not listed? Add it</summary>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;">
              <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" form="expense-category-quick-add">
              <input type="hidden" name="redirect_to" value="{{ url_for('expense_add') }}" form="expense-category-quick-add">
              <select name="parent_id" form="expense-category-quick-add" style="padding:6px;">
                <option value="">New Heading (top-level)</option>
                {% for h in headings %}
                <option value="{{ h.id }}">Sub-heading under: {{ h.name }}</option>
                {% endfor %}
              </select>
              <input type="text" name="name" form="expense-category-quick-add" placeholder="Name" style="padding:6px;" required>
              <button type="submit" form="expense-category-quick-add" class="btn btn-outline btn-xs">Create &amp; Use</button>
            </div>
          </details>
        </div>
        <div class="form-group">
          <label>Amount (USD)<span class="req">*</span></label>
          <input type="number" name="amount" step="0.01" min="0" required placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Date<span class="req">*</span></label>
          <input type="date" name="expense_date" required value="{{ today }}">
        </div>
        <div class="form-group">
          <label>Vehicle (optional)</label>
          <select name="vehicle_id">
            <option value="">Not vehicle-specific</option>
            {% for v in vehicles %}
            <option value="{{ v.id }}">{{ v.registration }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-group mb-16">
        <label>Description</label>
        <textarea name="description" rows="2"></textarea>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Save Expense</button>
        <a href="{{ url_for('expenses_list') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
