{% extends 'base.html' %}
{% block title %}{{ action }} Depot{% endblock %}
{% block page_title %}{{ action }} Depot{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>{{ action }} Depot</h1>
    <div class="subtitle">Branch / location configuration</div>
  </div>
  <a href="{{ url_for('depots') }}" class="btn btn-outline"><i data-feather="arrow-left"></i> Back to Depots</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid mb-16">
        <div class="form-group">
          <label>Depot Name<span class="req">*</span></label>
          <input type="text" name="name" required placeholder="e.g. Harare Depot"
                 value="{{ depot.name if depot else '' }}">
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" name="location" value="{{ depot.location if depot else '' }}">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status">
            <option value="active" {% if depot and depot.status=='active' %}selected{% endif %}>Active</option>
            <option value="inactive" {% if depot and depot.status=='inactive' %}selected{% endif %}>Inactive</option>
          </select>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Save Depot</button>
        <a href="{{ url_for('depots') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
