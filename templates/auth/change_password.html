{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Change Password</h1>
    <div class="subtitle">Update your account password</div>
  </div>
  <a href="{{ url_for('dashboard') }}" class="btn btn-outline"><i data-feather="arrow-left"></i> Back</a>
</div>

<div class="card" style="max-width:480px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group mb-16">
        <label>Current Password<span class="req">*</span></label>
        <input type="password" name="current_password" required autofocus>
      </div>
      <div class="form-group mb-16">
        <label>New Password<span class="req">*</span></label>
        <input type="password" name="new_password" required minlength="6">
      </div>
      <div class="form-group mb-16">
        <label>Confirm New Password<span class="req">*</span></label>
        <input type="password" name="confirm_password" required minlength="6">
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i data-feather="lock"></i> Change Password</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
