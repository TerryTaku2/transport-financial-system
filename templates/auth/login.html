<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | TransFleet ERP</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-mark.svg') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/icons/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 200 200" width="28" height="28" aria-hidden="true">
          <rect x="24" y="150" width="152" height="8" rx="4" fill="#fff" opacity="0.55"/>
          <rect x="26" y="78" width="26" height="8" rx="4" fill="#fff"/>
          <rect x="34" y="96" width="30" height="8" rx="4" fill="#fff"/>
          <rect x="26" y="114" width="24" height="8" rx="4" fill="#fff"/>
          <rect x="64" y="70" width="76" height="54" rx="8" fill="#fff"/>
          <polygon points="140,124 140,92 156,78 172,78 172,124" fill="#fff"/>
          <circle cx="96" cy="132" r="5" fill="#fff"/>
          <circle cx="156" cy="132" r="5" fill="#fff"/>
        </svg>
      </div>
      <h1>TransFleet ERP</h1>
      <p>Transport Fleet & Finance Management</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" style="margin-bottom:14px;">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group" style="margin-bottom:14px;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Enter username" autofocus>
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="login-footer">
      <p>T-Tech Solutions &copy; 2026 &mdash; All rights reserved</p>
    </div>
  </div>
</div>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
