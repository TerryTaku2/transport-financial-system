<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | GRATZ</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='img/icons/icon-192.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/icons/favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icons/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#16181a">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img class="logo-icon" src="{{ url_for('static', filename='img/logo-mark.png') }}" alt="">
      <h1>GRATZ</h1>
      <p>Logistics Company</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}" style="margin-bottom:14px;">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group" style="margin-bottom:14px;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Enter username" autofocus>
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <div class="login-footer">
      <p>GRATZ Logistics Company &copy; 2026 &mdash; All rights reserved</p>
    </div>
  </div>
</div>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
