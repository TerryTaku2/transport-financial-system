{% extends 'base.html' %}
{% block title %}Add User{% endblock %}
{% block page_title %}Admin — Add User{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Add System User</h1>
    <div class="subtitle">Grant access to the finance system</div>
  </div>
  <a href="{{ url_for('users') }}" class="btn btn-outline"><i data-feather="arrow-left"></i> Back</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <div class="form-grid mb-16">
        <div class="form-group">
          <label>Username<span class="req">*</span></label>
          <input type="text" name="username" required>
        </div>
        <div class="form-group">
          <label>Email<span class="req">*</span></label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Password<span class="req">*</span></label>
          <input type="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Role<span class="req">*</span></label>
          <select name="role">
            <option value="manager">Manager / Supervisor — data entry only</option>
            <option value="admin">Admin / Finance — full access</option>
          </select>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Create User</button>
        <a href="{{ url_for('users') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
