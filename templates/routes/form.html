{% extends 'base.html' %}
{% block title %}{{ action }} Route{% endblock %}
{% block page_title %}{{ action }} Route{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>{{ action }} Route</h1>
    <div class="subtitle">Route and fare configuration</div>
  </div>
  <a href="{{ url_for('routes_list') }}" class="btn btn-outline"><i data-feather="arrow-left"></i> Back to Routes</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid mb-16">
        <div class="form-group">
          <label>Route Name<span class="req">*</span></label>
          <input type="text" name="name" required placeholder="e.g. CBD - Chitungwiza"
                 value="{{ route.name if route else '' }}">
        </div>
        <div class="form-group">
          <label>Start Point<span class="req">*</span></label>
          <input type="text" name="start_point" required value="{{ route.start_point if route else '' }}">
        </div>
        <div class="form-group">
          <label>End Point<span class="req">*</span></label>
          <input type="text" name="end_point" required value="{{ route.end_point if route else '' }}">
        </div>
        <div class="form-group">
          <label>Distance (km)</label>
          <input type="number" name="distance_km" step="0.1" min="0" value="{{ route.distance_km if route else '' }}">
        </div>
        <div class="form-group">
          <label>Fare Rate (USD per trip)<span class="req">*</span></label>
          <input type="number" name="fare_rate" step="0.01" min="0" required value="{{ route.fare_rate if route else '' }}">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select name="status">
            <option value="active" {% if route and route.status=='active' %}selected{% endif %}>Active</option>
            <option value="inactive" {% if route and route.status=='inactive' %}selected{% endif %}>Inactive</option>
          </select>
        </div>
        <div class="form-group">
          <label>Depot</label>
          <select name="depot_id">
            <option value="">Unassigned</option>
            {% for dep in depots %}
            <option value="{{ dep.id }}" {% if route and route.depot_id==dep.id %}selected{% endif %}>{{ dep.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Save Route</button>
        <a href="{{ url_for('routes_list') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
