{% extends 'base.html' %}
{% block title %}{{ action }} Store Customer{% endblock %}
{% block page_title %}{{ action }} Store Customer{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>{{ action }} Store Customer</h1>
    <div class="subtitle">Outside customer who buys spares from the garage on account</div>
  </div>
  <a href="{{ url_for('store_customers') }}" class="btn btn-outline"><i data-feather="arrow-left"></i> Back to Customers</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid mb-16">
        <div class="form-group">
          <label>Name<span class="req">*</span></label>
          <input type="text" name="name" required placeholder="e.g. Moyo Motors"
                 value="{{ customer.name if customer else '' }}">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" placeholder="e.g. 077 123 4567"
                 value="{{ customer.phone if customer and customer.phone else '' }}">
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" name="address" placeholder="Optional"
                 value="{{ customer.address if customer and customer.address else '' }}">
        </div>
      </div>
      <div class="form-group mb-16">
        <label>Notes</label>
        <textarea name="notes" rows="3" placeholder="Optional notes">{{ customer.notes if customer and customer.notes else '' }}</textarea>
      </div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary"><i data-feather="save"></i> Save Customer</button>
        <a href="{{ url_for('store_customers') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
