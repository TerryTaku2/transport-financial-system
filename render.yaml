services:
  - type: web
    name: transport-erp
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    # --timeout 300: gunicorn's 30s default only ever covers routine
    # requests. Publishing a spoke release uploads a ~30MB zip through this
    # same worker (see spoke_release_upload in app.py) — on anything short
    # of a fast connection that alone can exceed 30s, and gunicorn kills
    # the worker as unresponsive mid-upload rather than just running slow.
    # 300s matches the timeout a spoke itself already uses to download a
    # release (see check_for_spoke_update's requests.get timeout=300).
    startCommand: "gunicorn -w 1 --threads 4 --timeout 300 -b 0.0.0.0:$PORT app:app"
    disk:
      name: transport-erp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/transport_erp.db
      - key: SPOKE_RELEASES_DIR
        value: /var/data/spoke_releases
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
